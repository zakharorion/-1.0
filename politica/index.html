<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Пользовательское соглашение — OFF Сянка</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../tokens.css" />
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--cream);color:var(--ink);
    font-family:var(--font-display);line-height:1.6;
    padding:64px 24px;
  }
  .doc{max-width:820px;margin:0 auto;}
  .back{
    display:inline-block;font-family:var(--font-mono);font-size:13px;
    letter-spacing:0.04em;text-transform:uppercase;color:var(--ink);
    border-bottom:1.5px solid var(--ink);padding-bottom:2px;margin-bottom:36px;
  }
  .back:hover{color:var(--red);border-color:var(--red);}
  h1{
    font-weight:800;text-transform:uppercase;letter-spacing:0.04em;
    font-size:clamp(30px,5vw,52px);line-height:1.02;margin:0 0 10px;
  }
  .upd{font-family:var(--font-mono);font-size:13px;color:var(--red);margin:0 0 32px;}
  .body{font-size:16px;letter-spacing:0.01em;color:var(--ink);opacity:.75;}
  a{color:var(--red);}
</style>
</head>
<body>
  <div class="doc">
    <a class="back" href="../index.html">← На главную</a>
    <h1>Пользовательское соглашение</h1>
    <p class="upd">OFF Сянка · offsyanka.ru</p>
    <p class="body">Текст будет добавлен позже.</p>
  </div>
</body>
</html>
